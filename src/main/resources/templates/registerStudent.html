
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision | Register Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <main class="register-page">

        <section class="register-container">

            <header class="register-header">
                <h1>Register Student</h1>
            </header>

            <div class="register-content">

                <form id="registerForm"
                      action="/register-student"
                      method="post"
                      enctype="multipart/form-data"
                      class="register-form">

                    <div class="form-group">
                        <label for="sapId">SAP ID</label>
                        <input
                            type="text"
                            id="sapId"
                            name="sapId"
                            placeholder="SAP ID"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Name"
                            required
                        >
                    </div>

                    <section class="photo-section">

                        <header class="section-header">
                            <h2>Capture Student Photo</h2>
                        </header>

                        <div class="camera-container">
                            <video
                                id="camera"
                                width="320"
                                autoplay
                                playsinline
                                style="display:none;"
                            ></video>

                            <canvas
                                id="canvas"
                                width="320"
                                hidden
                            ></canvas>

                            <img
                                id="preview"
                                width="200"
                                alt="Captured photo preview"
                                style="display:none;"
                            >
                        </div>

                        <div class="camera-actions">
                            <button type="button" id="openCamera">
                                Open Camera
                            </button>

                            <button
                                type="button"
                                id="capturePhoto"
                                disabled
                            >
                                Capture Photo
                            </button>
                        </div>

                        <input
                            type="file"
                            id="studentPhoto"
                            name="referencePhotoPath"
                            accept="image/*"
                            hidden
                        >

                    </section>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                        >
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="register-submit">
                            Register
                        </button>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <script>
        const video = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const photoInput = document.getElementById("studentPhoto");
        const openButton = document.getElementById("openCamera");
        const captureButton = document.getElementById("capturePhoto");
        const form = document.getElementById("registerForm");

        let stream = null;

        openButton.addEventListener("click", async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });

                video.srcObject = stream;
                video.style.display = "block";
                captureButton.disabled = false;
                preview.style.display = "none";
                photoInput.value = "";
            } catch (error) {
                alert("Cannot access camera. Please allow camera permission.");
                console.error(error);
            }
        });

        captureButton.addEventListener("click", () => {
            if (!video.videoWidth) {
                alert("Camera is not ready yet.");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const context = canvas.getContext("2d");
            context.drawImage(video, 0, 0);

            canvas.toBlob((blob) => {
                if (!blob) {
                    alert("Failed to capture photo.");
                    return;
                }

                const file = new File(
                    [blob],
                    "student-photo.jpg",
                    { type: "image/jpeg" }
                );

                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                photoInput.files = dataTransfer.files;

                preview.src = URL.createObjectURL(blob);
                preview.style.display = "block";

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                video.style.display = "none";
                captureButton.disabled = true;
                openButton.textContent = "Retake Photo";
            }, "image/jpeg", 0.9);
        });

        // Ensure a photo has been captured
        form.addEventListener("submit", (event) => {
            if (!photoInput.files.length) {
                event.preventDefault();
                alert("Please capture a student photo first.");
            }
        });
    </script>

</body>
</html>
