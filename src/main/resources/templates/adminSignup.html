<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup | Vision</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <header class="auth-header">
                <h1>Admin Signup</h1>
                <p>Create an administrator account for Vision.</p>
            </header>

            <div class="auth-messages">

                <!-- GitHub Authentication Messages -->
                <p th:if="${param.githubEmailConflict}">
                    An account with this email already exists.
                    Please log in using your existing account.
                </p>

                <p th:if="${param.oauthError}">
                    GitHub sign-in failed. Please try again.
                </p>

            </div>

            <!-- Existing GitHub Email Conflict Alert -->
            <script th:if="${param.githubEmailConflict}">
                alert('An account with this email already exists. Please log in using your existing account.');
            </script>

            <div class="auth-content">

                <!-- Admin Registration Form -->
                <form action="/admin/register" method="post" class="auth-form">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Enter your subject" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <button type="submit">Sign Up</button>

                </form>

                <!-- Alternative Signup -->
                <div class="auth-alternative">
                    <p>Or sign up using</p>

                    <a href="/oauth2/authorization/github">
                        Sign Up using GitHub
                    </a>
                </div>

            </div>

            <!-- Login Navigation -->
            <footer class="auth-footer">
                <p>
                    Already have an account?
                    <a href="/admin/login">Log in</a>
                </p>
            </footer>

        </section>

    </main>

</body>

</html>
