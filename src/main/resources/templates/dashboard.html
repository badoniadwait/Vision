<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision | Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">


        <h1 class="brand"> Vision.
        </h1>

        <div class="navbar-actions">

            <a href="/admin/profile" class="profile-link">

                <div class="profile-avatar">
                    <img th:src="@{/images/adminAvatar.png}" alt="Admin Avatar">
                </div>

                <span th:text="${adminName}">Admin</span>

            </a>

        </div>

    </nav>


    <!-- Main Dashboard Content -->
    <main class="container">

        <!-- Dashboard Header -->
        <header class="welcome-section">

            <div class="welcome-content">
                <h1>Dashboard</h1>
            </div>

            <div class="welcome-actions">
                <a href="/upload-quiz" class="upload-btn">
                    + Upload New Quiz
                </a>
            </div>

        </header>


        <!-- Quiz Management Section -->
        <section class="quiz-section">

            <!-- Section Header -->
            <header class="section-header">

                <h2>Your Quizzes</h2>

                <span class="quiz-count" th:text="${quizzes != null ? quizzes.size() + ' quizzes' : '0 quizzes'}">
                    0 quizzes
                </span>

            </header>


            <!-- Quiz List -->
            <div class="quiz-grid" th:if="${quizzes != null and !#lists.isEmpty(quizzes)}">

                <!-- Individual Quiz Card -->
                <article class="quiz-card" th:each="quiz : ${quizzes}">

                    <!-- Quiz Header -->
                    <header class="quiz-top">

                        <h3 class="quiz-title" th:text="'Quiz #' + ${quiz.id}">
                            Quiz #1
                        </h3>

                        <span class="status"
                            th:classappend="${quiz.expiresAt != null and quiz.expiresAt.isAfter(T(java.time.Instant).now())} ? ' status-active' : ' status-expired'"
                            th:text="${quiz.expiresAt != null and quiz.expiresAt.isAfter(T(java.time.Instant).now())} ? 'Active' : 'Expired'">
                            Active
                        </span>

                    </header>


                    <!-- Quiz Information -->
                    <div class="quiz-details">

                        <!-- Duration -->
                        <div class="quiz-detail">

                            <div class="detail-label">
                                Duration
                            </div>

                            <div class="detail-value" th:text="${quiz.durationMinutes} + ' minutes'">
                                60 minutes
                            </div>

                        </div>


                        <!-- Question Count -->
                        <div class="quiz-detail">

                            <div class="detail-label">
                                Questions
                            </div>

                            <div class="detail-value" th:text="${quiz.questions.size()}">
                                2
                            </div>

                        </div>


                        <!-- Creation Date -->
                        <div class="quiz-detail">

                            <div class="detail-label">
                                Created At
                            </div>

                            <div class="detail-value"
                                th:text="${quiz.createdAt != null ? #temporals.format(quiz.createdAt, 'dd MMM yyyy') : 'N/A'}">
                                03 Nov 2026
                            </div>

                        </div>


                        <!-- Expiry Date -->
                        <div class="quiz-detail">

                            <div class="detail-label">
                                Expires At
                            </div>

                            <div class="detail-value"
                                th:text="${quiz.expiresAt != null ? #temporals.format(quiz.expiresAt, 'dd MMM yyyy, hh:mm a') : 'N/A'}">
                                03 Nov 2026
                            </div>

                        </div>

                    </div>


                    <!-- Quiz Actions -->
                    <footer class="quiz-actions">

                        <form th:action="@{/admin/quizzes/{id}/delete(id=${quiz.id})}" method="post"
                            onsubmit="return confirm('Are you sure you want to delete this quiz?');">

                            <button type="submit" class="delete-btn">
                                Delete Quiz
                            </button>

                        </form>

                    </footer>

                </article>

            </div>


            <!-- Empty State -->
            <div class="empty-state" th:if="${quizzes == null or #lists.isEmpty(quizzes)}">

                <p>No quiz yet</p>

            </div>

        </section>

    </main>




</body>

</html>
