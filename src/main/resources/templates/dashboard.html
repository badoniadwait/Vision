
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vision | Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        /* Navbar */

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e8ebf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            color: #315efb;
            letter-spacing: -1px;
        }

        .profile-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #263248;
            font-size: 14px;
            font-weight: 600;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9efff;
            color: #315efb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            font-weight: 700;
        }

        /* Main content */

        .container {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .welcome-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .welcome-section h1 {
            font-size: 30px;
            margin-bottom: 9px;
            letter-spacing: -0.8px;
        }

        .welcome-section p {
            color: #7a8497;
            font-size: 14px;
        }

        .upload-btn {
            background: #315efb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .upload-btn:hover {
            background: #244bd4;
        }

        /* Statistics */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border: 1px solid #e9edf4;
            border-radius: 13px;
        }

        .stat-label {
            color: #7a8497;
            font-size: 13px;
            margin-bottom: 13px;
        }

        .stat-value {
            font-size: 29px;
            font-weight: 750;
            color: #172033;
        }

        /* Quiz section */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 21px;
        }

        .quiz-count {
            color: #7a8497;
            font-size: 13px;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .quiz-card {
            background: white;
            border: 1px solid #e9edf4;
            border-radius: 13px;
            padding: 23px;
            transition: 0.2s;
        }

        .quiz-card:hover {
            border-color: #cbd7ff;
            box-shadow: 0 7px 22px rgba(25, 45, 90, 0.06);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quiz-title {
            font-size: 17px;
            font-weight: 700;
        }

        .status {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-active {
            background: #e5f8ed;
            color: #168348;
        }

        .status-expired {
            background: #f0f1f4;
            color: #747d8c;
        }

        .quiz-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            padding-bottom: 20px;
            border-bottom: 1px solid #edf0f5;
        }

        .detail-label {
            font-size: 12px;
            color: #8992a3;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #354158;
        }

        .quiz-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 17px;
        }

        .delete-btn {
            border: 1px solid #f0caca;
            background: #fff7f7;
            color: #d14343;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #ffe9e9;
        }

        /* Empty state */

        .empty-state {
            background: white;
            border: 1px dashed #d7deeb;
            border-radius: 13px;
            padding: 65px 20px;
            text-align: center;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 9px;
        }

        .empty-state p {
            color: #8992a3;
            font-size: 13px;
            margin-bottom: 22px;
        }

        /* Footer */

        .footer {
            text-align: center;
            color: #9aa2b1;
            font-size: 12px;
            padding: 35px 15px;
        }

        /* Responsive */

        @media (max-width: 750px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                margin-top: 30px;
            }

            .welcome-section {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="brand">Vision.</div>

        <a href="/admin/profile" class="profile-link">
            <div class="profile-avatar">A</div>
            <span th:text="${adminName}">Admin</span>
        </a>

    </nav>


    <!-- Main Dashboard -->

    <main class="container">

        <!-- Welcome Section -->

        <section class="welcome-section">

            <div>
                <h1>Dashboard</h1>
            </div>

            <a href="/upload-quiz" class="upload-btn">
                + Upload New Quiz
            </a>

        </section>


        <!-- Quiz List -->

        <section>

            <div class="section-header">

                <h2>Your Quizzes</h2>

                <span class="quiz-count"
                      th:text="${quizzes != null ? quizzes.size() + ' quizzes' : '0 quizzes'}">
                    0 quizzes
                </span>

            </div>


            <!-- Quiz Cards -->

            <div class="quiz-grid"
                 th:if="${quizzes != null and !#lists.isEmpty(quizzes)}">

                <div class="quiz-card" th:each="quiz : ${quizzes}">

                    <div class="quiz-top">

                        <div class="quiz-title"
                             th:text="'Quiz #' + ${quiz.id}">
                            Quiz #1
                        </div>

                        <span class="status"
                              th:classappend="${quiz.expiresAt != null and quiz.expiresAt.isAfter(T(java.time.Instant).now())} ? ' status-active' : ' status-expired'"
                              th:text="${quiz.expiresAt != null and quiz.expiresAt.isAfter(T(java.time.Instant).now())} ? 'Active' : 'Expired'">
                            Active
                        </span>

                    </div>


                    <div class="quiz-details">

                        <div>
                            <div class="detail-label">Duration</div>
                            <div class="detail-value"
                                 th:text="${quiz.durationMinutes} + ' minutes'">
                                60 minutes
                            </div>
                        </div>

                        <div>
                            <div class="detail-label">Questions</div>
                            <div class="detail-value"
                                 th:text="${quiz.questions.size()}">
                                2
                            </div>
                        </div>

                        <div>
                            <div class="detail-label">Created At</div>
                            <div class="detail-value"
                                 th:text="${quiz.createdAt != null ? #temporals.format(quiz.createdAt, 'dd MMM yyyy') : 'N/A'}">
                                03 Nov 2026
                            </div>
                        </div>

                        <div>
                            <div class="detail-label">Expires At</div>
                            <div class="detail-value"
                                 th:text="${quiz.expiresAt != null ? #temporals.format(quiz.expiresAt, 'dd MMM yyyy, hh:mm a') : 'N/A'}">
                                03 Nov 2026
                            </div>
                        </div>

                    </div>


                    <!-- Delete Quiz -->

                    <div class="quiz-actions">

                        <form th:action="@{/admin/quizzes/{id}/delete(id=${quiz.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this quiz?');">

                            <button type="submit" class="delete-btn">
                                Delete Quiz
                            </button>

                        </form>

                    </div>

                </div>

            </div>


            <!-- Empty State -->

            <div class="empty-state"
                 th:if="${quizzes == null or #lists.isEmpty(quizzes)}">

                <p>No quiz yet</p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer class="footer">
        © 2026 Vision. All rights reserved.
    </footer>

</body>
</html>
