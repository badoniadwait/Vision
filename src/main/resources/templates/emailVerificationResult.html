<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
</head>
<body>
    <h1 th:if="${verified}">Email verified</h1>
    <p th:if="${verified}">Your Vision admin email has been verified.</p>
    <h1 th:unless="${verified}">Verification link invalid or expired</h1>
    <p th:unless="${verified}">Request a new verification email from your profile.</p>
    <a href="/admin/profile">Return to profile</a>
</body>
</html>
